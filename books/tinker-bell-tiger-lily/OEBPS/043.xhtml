    <p class="no-indent">
      <span class="font-4">
        <span id="w799">Then</span>
        <span id="w800">Tink</span>
        <span id="w801">flew</span>
        <span id="w802">up</span>
        <span id="w803">to</span>
        <span id="w804">the</span>
        <span id="w805">plant.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w806">Lily</span>
        <span id="w807">could</span>
        <span id="w808">not</span>
        <span id="w809">believe</span>
        <span id="w810">her</span>
        <span id="w811">eyes.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w812">The</span>
        <span id="w813">tiger</span>
        <span id="w814">lily</span>
        <span id="w815">drooped</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w816">against</span>
        <span id="w817">the</span>
        <span id="w818">fence.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w819">It</span>
        <span id="w820">looked</span>
        <span id="w821">sad!</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w822">It</span>
        <span id="w823">looked</span>
        <span id="w824">hungry!</span>
      </span>
    </p>
