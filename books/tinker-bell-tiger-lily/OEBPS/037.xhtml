    <p class="no-indent">
      <span class="font-4">
        <span id="w665">&#8220;Vidia!&#8221;</span>
        <span id="w666">Lily</span>
        <span id="w667">yelled.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w668">&#8220;You</span>
        <span id="w669">fed</span>
        <span id="w670">my</span>
        <span id="w671">tiger</span>
        <span id="w672">lily.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w673">And</span>
        <span id="w674">now</span>
        <span id="w675">it&#8217;s</span>
        <span id="w676">grouchy!&#8221;</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w677">Tink</span>
        <span id="w678">flew</span>
        <span id="w679">between</span>
        <span id="w680">Lily</span>
        <span id="w681">and</span>
        <span id="w682">Vidia.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w683">&#8220;It&#8217;s</span>
        <span id="w684">not</span>
        <span id="w685">all</span>
        <span id="w686">Vidia&#8217;s</span>
        <span id="w687">fault,&#8221;</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w688">she</span>
        <span id="w689">said.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w690">&#8220;I</span>
        <span id="w691">fed</span>
        <span id="w692">your</span>
        <span id="w693">flower,</span>
        <span id="w694">too.&#8221;</span>
      </span>
    </p>
