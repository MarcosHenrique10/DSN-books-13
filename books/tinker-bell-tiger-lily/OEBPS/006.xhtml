        <span id="w67">over.</span>
      </span>

    <p class="no-indent">
      <span class="font-4">
        <span id="w68">&#8220;Oh,</span>

    </p>

      <span class="font-4">

        <span id="w75">plant.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w76">&#8220;You</span>
        <span id="w77">are</span>
        <span id="w78">lovely!&#8221;</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w79">The</span>
        <span id="w80">tiger</span>

        <span id="w82">was</span>
        <span id="w83">bright</span>
        <span id="w84">orange</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w85">with</span>
        <span id="w86">dark</span>
        <span id="w87">stripes.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">

        <span id="w91">water</span>
      </span>

        <span id="w92">on</span>
        <span id="w93">the</span>
        <span id="w94">ground</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w95">around</span>
