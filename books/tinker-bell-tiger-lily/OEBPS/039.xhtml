        <span id="w721">Lily&#8217;s</span>

        <span id="w727">She</span>
        <span id="w728">sat</span>
        <span id="w729">down.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w730">&#8220;You</span>
        <span id="w731">all</span>

        <span id="w733">my</span>
        <span id="w734">tiger</span>

      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w738">&#8220;Why?&#8221;</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w739">Tink</span>
        <span id="w740">put</span>
        <span id="w741">her</span>
        <span id="w742">arm</span>
        <span id="w743">around</span>
        <span id="w744">Lily.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w745">&#8220;Come</span>
        <span id="w746">on,&#8221;</span>
        <span id="w747">Tink</span>
        <span id="w748">said.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w749">&#8220;We&#8217;ll</span>
