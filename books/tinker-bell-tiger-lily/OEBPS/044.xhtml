  <div class="text-frame" style="left:82px; top:67px; width:542px; height:423px;">
    <p class="no-indent">
      <span class="font-4">
        <span id="w825">But</span>
        <span id="w826">Lily</span>
        <span id="w827">knew</span>
        <span id="w828">the</span>
        <span id="w829">tiger</span>
        <span id="w830">lily</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w831">wasn&#8217;t</span>
        <span id="w832">sad.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w833">It</span>
        <span id="w834">wasn&#8217;t</span>
        <span id="w835">hungry,</span>
        <span id="w836">either.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w837">Lily</span>
        <span id="w838">darted</span>
        <span id="w839">forward.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w840">&#8220;You</span>
        <span id="w841">sneaky</span>
        <span id="w842">little</span>
        <span id="w843">flower!&#8221;</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w844">she</span>
        <span id="w845">said.</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w846">&#8220;You&#8217;re</span>
        <span id="w847">so</span>
        <span id="w848">clever,</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w849">you</span>
        <span id="w850">fooled</span>
        <span id="w851">everyone!&#8221;</span>
      </span>
    </p>
    <p class="no-indent">
      <span class="font-4">
        <span id="w852">The</span>
        <span id="w853">tiger</span>
        <span id="w854">lily</span>
        <span id="w855">hung</span>
        <span id="w856">its</span>
        <span id="w857">head.</span>
      </span>
    </p>
